name = "sympyProofs"
version = "0.1.0"
defaultTargets = ["SympyProofs"]
leanOptions = { experimental.vcgen = true }

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "SympyProofs"
# Many files here do not use the module system yet. Mathlib asks for it since v4.36.0.
allowNonModules = true
